# ============================================================================
# Core Pack：默认原生器官
# ============================================================================
# 玩家首次建档时，slots.yml 的 default-organ 会引用本文件中的 ID。
# 原生器官是普通、真实、可交易和可移植的部件，只是额外记录最初主人姓名与 UUID。
#
# 字段：
# slot-type         只能安装到 slots.yml 中 type 相同的位置。
# material          原版载体材质；留空时默认为 PAPER。
# item-model        1.21.11 资源包 item_model 键；留空则不设置。
# custom-model-data 兼容服主已有模型分配；留空或 0 时不设置。
# capacity-cost     安装后占用的义体容量，原生器官通常为 0。
# display-name      支持 MiniMessage；<owner> 会替换为器官最初主人。
# lore              支持 <owner>、<owner_uuid>、<capacity>、<slot>。
# triggers          与普通义体相同；空列表表示没有额外能力。

items:
  native-brain:
    slot-type: BRAIN
    material: PAPER
    item-model: "bccyberware:native_brain"
    custom-model-data: 1001
    capacity-cost: 0
    original-organ: true
    display-name: "<white><owner> 的原生脑组织"
    lore:
      - "<gray>未经人工改造的神经中枢。"
      - "<dark_gray>原始主人：<white><owner>"
      - "<dark_gray>器官来源会永久保留，但允许移植。"
    triggers: []

