# ============================================================================
# 玩家消息
# ============================================================================
# 全部文本支持 MiniMessage。可用变量由每条消息旁边的注释说明。

prefix: "<dark_gray>[<aqua>BcCyberware<dark_gray>] <reset>"

no-permission: "<red>你没有执行此操作的权限。"
player-only: "<red>该命令只能由游戏内玩家执行。"
profile-loading: "<yellow>你的义体数据仍在加载，请稍后再试。"
config-reloaded: "<green>全部配置已通过校验并完成原子重载。"
config-reload-failed: "<red>重载失败，旧配置继续生效。请查看后台错误详情。"
config-reloaded-resource-pack-kept: "<yellow>主配置已加载，但新的义体资源未能提交给 Oraxen；资源服务继续使用上一个可用状态。请查看后台。"
config-reload-resource-pack-started: "<yellow>主配置已加载；义体资源正在后台生成并准备注入 Oraxen，完成后会再次通知。"
unknown-cyberware: "<red>找不到义体：<white><id>"
unknown-player: "<red>找不到在线玩家：<white><player>"
invalid-number: "<red>数值格式无效：<white><value>"
item-given: "<green>已给予 <white><player> <aqua><item> <gray>×<amount>。"
inventory-full: "<red>背包空间不足，操作已完整取消。"
no-compatible-items: "<yellow>背包中没有可安装到 <white><slot> <yellow>的部件。"
capacity-insufficient: "<red>容量不足：安装后需要 <used>，你的上限为 <total>。"
installed: "<green>已将 <item> <green>安装到 <slot>。"
replaced: "<green>已用 <item> <green>替换 <old>。"
removed: "<yellow>已拆下 <item>。该部位为空时会产生生理缺点。"
remove-warning: "<red>再次点击确认拆卸 <item>；部位空缺效果：<white><effects>"
not-cyberware: "<yellow>你主手中的物品不是由 BcCyberware 签发的部件。"
inspect-result: "<gray>ID=<id>，槽位类型=<slot>，实例=<instance>，原主人=<owner>"
resource-pack-generation-started: "<yellow>义体资源正在后台合并生成，完成后会提交给 Oraxen。"
resource-pack-generated: "<green>义体资源已经重新生成并提交给 Oraxen；最终包将由 Oraxen 生成、上传和下发。"
resource-pack-generate-failed: "<red>义体资源生成或 Oraxen 注入准备失败，请查看后台的具体错误。"
resource-pack-busy: "<yellow>已有义体资源生成或 Oraxen 注入任务正在运行；请等待完成后再重试。"
resource-pack-managed-by-oraxen: "<yellow>资源包由 Oraxen 统一下发；请由管理员使用 Oraxen 的资源包重发功能。"
capacity-updated: "<green>已将 <player> 的永久容量调整为 <value>。"
capacity-result: "<gray><player>：已用 <used> / <total>，其中永久加成 <permanent>。"
usage: "<yellow>用法：/bccyberware [open|give|capacity|reload|inspect|pack|resourcepack]"
