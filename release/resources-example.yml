# ============================================================================
# 资源包生成与 Oraxen 注入
# ============================================================================
# 每个内容 Pack 可在自己的 Assets/ 目录放置标准资源包文件，例如：
#   plugins/BcCyberware/packs/core/Assets/assets/bccyberware/textures/item/...
# 插件按 Pack 优先级合并 Assets，最后覆盖 Generation/merge 中的服主自定义内容。

generation:
  # true：允许 /bccyberware resourcepack generate，并按配置自动生成。
  enabled: true

  # true：每次插件启动或完整重载时在后台重新合并资源，不阻塞服务器主线程。
  generate-on-startup: true

  # BcCyberware 中间 ZIP 的位置，相对于 plugins/BcCyberware/。
  # 它只用于整理和校验注入内容，不会直接发给玩家。
  output: "Generation/resource_pack.zip"

  # 服主需要强制覆盖/补充的资源放在这里；此目录最后合并，优先级最高。
  merge-directory: "Generation/merge"

oraxen:
  # true：把 BcCyberware 生成的 assets/ 文件注入 Oraxen 的最终资源包。
  # 本插件不监听 HTTP 端口，也不会单独向玩家发送第二份资源包。
  # Oraxen 负责最终 ZIP、上传、SHA-1、提示和进服自动下发。
  # Oraxen 可选：未安装/未启用时仍可运行。客户端未加载资源包时显示原版纸张。
  # 纸张选择器自动生成；注入时保留 Oraxen 已有纸张模型，不占用其数字模型编号。
  enabled: true

  # true：生成完成后调用 OraxenPack.reloadPack()，立即重建 Oraxen 最终包。
  reload-after-generation: true
